<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{if .Title}}{{.Title}} - {{end}}MrTermux</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-[#0a0a0f] text-gray-300 antialiased">
    <nav class="fixed top-0 w-full z-50 bg-[#0a0a0f]/80 backdrop-blur-lg border-b border-white/5">
        <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-green-500/20 flex items-center justify-center">
                    <i class="fa-solid fa-terminal text-green-400 text-lg"></i>
                </div>
                <span class="font-semibold text-white tracking-tight">MrTermux</span>
            </div>
            <a href="/" class="text-sm text-gray-400 hover:text-white transition-colors">Home</a>
        </div>
    </nav>

    <main class="pt-32 pb-16">
        {{block "content" .}}{{end}}
    </main>

    <footer class="border-t border-white/5 py-8">
        <div class="max-w-6xl mx-auto px-6 text-center">
            <p class="text-sm text-gray-500">
                <span class="text-gray-600">Termux Profile v1.0</span>
            </p>
        </div>
    </footer>
    <script src="/static/js/main.js"></script>
</body>
</html>
