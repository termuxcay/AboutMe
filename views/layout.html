<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{if .Title}}{{.Title}} - {{end}}MrTermux | Security Researcher</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Fira+Code:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-[#0a0a0f] text-gray-300 antialiased overflow-x-hidden">
    <!-- Matrix Rain Canvas -->
    <canvas id="matrix-canvas" class="fixed top-0 left-0 w-full h-full pointer-events-none z-0 opacity-20"></canvas>

    <!-- Scanline Effect -->
    <div class="scanline fixed top-0 left-0 w-full h-full pointer-events-none z-40"></div>

    <!-- Navigation -->
    <nav class="fixed top-0 w-full z-50 bg-[#0a0a0f]/90 backdrop-blur-xl border-b border-pink-500/10">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3 group cursor-pointer">
                <div class="w-10 h-10 rounded-lg bg-pink-500/10 border border-pink-500/30 flex items-center justify-center group-hover:bg-pink-500/20 group-hover:border-pink-500/50 transition-all duration-300">
                    <i class="fa-solid fa-terminal text-pink-400 text-lg group-hover:text-pink-300"></i>
                </div>
                <div>
                    <span class="font-bold text-white tracking-tight block text-sm leading-tight">MrTermux</span>
                    <span class="text-[10px] text-pink-500/60 font-mono">root@system:~#</span>
                </div>
            </div>
            <div class="flex items-center gap-6">
                <a href="/" class="text-sm text-gray-400 hover:text-pink-400 transition-colors font-mono">
                    <span class="text-pink-500 mr-1">~</span>/home
                </a>
                <div class="hidden md:flex items-center gap-2 text-xs text-gray-500 font-mono">
                    <span class="w-2 h-2 rounded-full bg-pink-500 animate-pulse"></span>
                    <span>ONLINE</span>
                </div>
            </div>
        </div>
    </nav>

    <main class="pt-24 pb-16 relative z-10">
        {{block "content" .}}{{end}}
    </main>

    <!-- Footer -->
    <footer class="border-t border-pink-500/10 py-8 relative z-10">
        <div class="max-w-7xl mx-auto px-6">
            <div class="flex flex-col md:flex-row items-center justify-between gap-4">
                <div class="flex items-center gap-3 text-xs text-gray-500 font-mono">
                    <span class="text-pink-500">$</span>
                    <span>MrTermux Profile v2.0</span>
                    <span class="text-gray-600">|</span>
                    <span>Built with <span class="text-pink-400">Go</span> + <span class="text-purple-400">Fiber</span></span>
                </div>
                <div class="flex items-center gap-4">
                    <a href="https://github.com/Mrtermux" target="_blank" class="text-gray-500 hover:text-pink-400 transition-colors">
                        <i class="fa-brands fa-github text-lg"></i>
                    </a>
                    <a href="https://t.me/Mrtermux" target="_blank" class="text-gray-500 hover:text-purple-400 transition-colors">
                        <i class="fa-brands fa-telegram text-lg"></i>
                    </a>
                </div>
            </div>
        </div>
    </footer>

    <script src="/static/js/main.js"></script>
</body>
</html>
